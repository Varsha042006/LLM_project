<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalGPT Firebase Google Sign-In</title>
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Google Sign-In Button styled exactly like the UI reference */
    .google-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 46px;
      background: #ffffff;
      color: #1e293b;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      outline: none;
    }

    .google-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    .google-btn:active {
      background: #f1f5f9;
      transform: translateY(0);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .google-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none !important;
    }

    .google-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .google-icon-svg {
      width: 19px;
      height: 19px;
    }

    .btn-text {
      font-size: 14.5px;
      font-weight: 600;
      color: #1e293b;
    }

    /* Keep clean white button matching UI reference */
    body.dark-mode .google-btn {
      background: #ffffff;
      color: #1e293b;
      border-color: #e2e8f0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    body.dark-mode .google-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
    }

    body.dark-mode .google-btn:active {
      background: #f1f5f9;
    }

    /* Spinner */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(60, 64, 67, 0.25);
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    body.dark-mode .spinner {
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #00f0ff;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error Banner */
    .error-banner {
      display: none;
      width: 100%;
      background: #fdf2f2;
      border: 1px solid #f8b4b4;
      color: #9b1c1c;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      text-align: left;
    }

    body.dark-mode .error-banner {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* Config Hint Banner */
    .config-banner {
      display: none;
      width: 100%;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      line-height: 1.4;
      text-align: left;
    }
  </style>
</head>
<body class="dark-mode">
  <div class="container">
    <button id="google-sign-in-btn" class="google-btn" type="button">
      <div class="google-icon-wrapper">
        <svg class="google-icon-svg" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      </div>
      <div id="btn-spinner" class="spinner"></div>
      <span id="btn-label" class="btn-text">Continue with Google</span>
    </button>

    <div id="error-message" class="error-banner"></div>
    <div id="config-message" class="config-banner"></div>
  </div>

  <script>
    let currentConfig = null;
    let firebaseInitialized = false;

    // Streamlit PostMessage Protocol Utilities
    function sendValueToStreamlit(value) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: value
      }, "*");
    }

    function setFrameHeight(height) {
      const h = height || document.documentElement.scrollHeight || document.body.scrollHeight || 70;
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setFrameHeight",
        height: Math.max(h, 60)
      }, "*");
    }

    function showError(msg) {
      const errEl = document.getElementById("error-message");
      if (errEl) {
        errEl.innerText = msg;
        errEl.style.display = "block";
        setFrameHeight();
      }
    }

    function hideError() {
      const errEl = document.getElementById("error-message");
      if (errEl) {
        errEl.style.display = "none";
        setFrameHeight();
      }
    }

    function showConfigHint(msg) {
      const cfgEl = document.getElementById("config-message");
      if (cfgEl) {
        cfgEl.innerHTML = msg;
        cfgEl.style.display = "block";
        setFrameHeight();
      }
    }

    function hideConfigHint() {
      const cfgEl = document.getElementById("config-message");
      if (cfgEl) {
        cfgEl.style.display = "none";
        setFrameHeight();
      }
    }

    function setLoading(isLoading, labelText) {
      const btn = document.getElementById("google-sign-in-btn");
      const spinner = document.getElementById("btn-spinner");
      const label = document.getElementById("btn-label");
      const iconWrapper = document.querySelector(".google-icon-wrapper");

      btn.disabled = isLoading;
      if (isLoading) {
        spinner.style.display = "inline-block";
        if (iconWrapper) iconWrapper.style.display = "none";
        label.innerText = labelText || "Connecting to Google...";
      } else {
        spinner.style.display = "none";
        if (iconWrapper) iconWrapper.style.display = "flex";
        label.innerText = "Continue with Google";
      }
      setFrameHeight();
    }

    function initializeFirebase(cfg) {
      if (!cfg || !cfg.apiKey || cfg.apiKey.length < 5) {
        showConfigHint("ℹ️ <strong>Firebase configuration pending:</strong> Add your Firebase Web App credentials to <code>.streamlit/secrets.toml</code> to enable live Google Sign-In.");
        return false;
      }

      hideConfigHint();

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(cfg);
        }
        firebaseInitialized = true;
        return true;
      } catch (e) {
        console.error("Firebase init error:", e);
        showError("Firebase configuration error: " + e.message);
        return false;
      }
    }

    // Google Sign-In Execution
    async function triggerGoogleSignIn() {
      hideError();

      if (!firebaseInitialized) {
        if (!initializeFirebase(currentConfig)) {
          showError("Firebase Web App configuration is missing or incomplete. Please check .streamlit/secrets.toml.");
          return;
        }
      }

      setLoading(true, "Selecting Google Account...");

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope("email");
        provider.addScope("profile");
        // Always prompt account chooser so user can select different accounts
        provider.setCustomParameters({ prompt: "select_account" });

        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;

        setLoading(true, "Verifying credentials...");

        // Obtain verified Firebase ID token (JWT)
        const idToken = await user.getIdToken(/* forceRefresh */ true);

        // Send payload back to Streamlit
        sendValueToStreamlit({
          status: "success",
          idToken: idToken,
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || user.email.split("@")[0],
          photoURL: user.photoURL || null,
          nonce: Date.now()
        });

        setLoading(false);
      } catch (err) {
        console.error("Sign-In Popup Error:", err);
        setLoading(false);

        let userMsg = "Authentication cancelled or failed.";
        if (err.code === "auth/popup-closed-by-user") {
          userMsg = "Sign-in popup was closed before completing. Please click to try again.";
        } else if (err.code === "auth/unauthorized-domain") {
          userMsg = "Domain not authorized. Please add 'localhost' to Firebase Console > Authentication > Settings > Authorized Domains.";
        } else if (err.code === "auth/popup-blocked") {
          userMsg = "The Google sign-in popup was blocked by your browser. Please allow popups for localhost.";
        } else if (err.message) {
          userMsg = err.message;
        }

        showError(userMsg);

        sendValueToStreamlit({
          status: "error",
          code: err.code || "unknown_error",
          message: userMsg,
          nonce: Date.now()
        });
      }
    }

    // Sign out execution if requested from Python
    async function triggerSignOut() {
      try {
        if (firebaseInitialized && firebase.auth().currentUser) {
          await firebase.auth().signOut();
        }
        sendValueToStreamlit({ status: "signed_out", nonce: Date.now() });
      } catch (e) {
        console.warn("Sign out exception:", e);
      }
    }

    // Attach Click Listener
    document.getElementById("google-sign-in-btn").addEventListener("click", triggerGoogleSignIn);

    // Streamlit Message Listener
    window.addEventListener("message", function (event) {
      if (event.data && event.data.type === "streamlit:render") {
        const args = event.data.args || {};

        // Theme management
        if (args.theme === "light") {
          document.body.classList.remove("dark-mode");
        } else {
          document.body.classList.add("dark-mode");
        }

        // Action dispatching (e.g. sign_out)
        if (args.action === "sign_out") {
          triggerSignOut();
        }

        // Configuration updating
        if (args.firebaseConfig) {
          currentConfig = args.firebaseConfig;
          initializeFirebase(currentConfig);
        }

        setFrameHeight();
      }
    });

    // Notify Streamlit that Component is Loaded
    window.addEventListener("DOMContentLoaded", () => {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:componentReady",
        apiVersion: 1
      }, "*");
      setFrameHeight();
    });

    // Observe size changes
    window.addEventListener("resize", () => setFrameHeight());
  </script>
</body>
</html>
